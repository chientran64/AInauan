<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Chef Master - Sổ Tay Nấu Nướng</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap');
        
        :root {
            --primary-orange: #f97316;
            --secondary-amber: #fbbf24;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background: #fdf6f0;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }

        .gradient-text {
            background: linear-gradient(90deg, var(--primary-orange), var(--secondary-amber));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Markdown Styling */
        #aiResponse {
            font-family: 'Inter', sans-serif;
            color: #374151;
            line-height: 1.7;
            font-size: 0.95rem;
        }
        
        #aiResponse h3 {
            font-family: 'Quicksand', sans-serif;
            font-size: 1.25rem;
            font-weight: 800;
            color: #7c2d12;
            margin-top: 1.5rem;
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        #aiResponse h3::before {
            content: '';
            display: inline-block;
            width: 5px;
            height: 20px;
            background: var(--primary-orange);
            border-radius: 10px;
        }

        #aiResponse table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin: 1rem 0;
            background: #fff;
            border-radius: 1rem;
            overflow: hidden;
            border: 1px solid #fed7aa;
            display: block;
            overflow-x: auto;
        }

        #aiResponse th {
            background: #fff7ed;
            padding: 0.75rem;
            text-align: left;
            color: #9a3412;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.7rem;
            white-space: nowrap;
        }

        #aiResponse td {
            padding: 0.75rem;
            border-bottom: 1px solid #fff7ed;
            font-size: 0.875rem;
        }

        .switch { position: relative; display: inline-block; width: 48px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #e2e8f0; transition: .4s; border-radius: 34px;
        }
        .slider:before {
            position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px;
            background-color: white; transition: .4s; border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--primary-orange); }
        input:checked + .slider:before { transform: translateX(24px); }

        .pulse-orange { animation: pulse-orange-animation 2s infinite; }
        @keyframes pulse-orange-animation {
            0% { box-shadow: 0 0 0 0 rgba(249, 115, 22, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(249, 115, 22, 0); }
            100% { box-shadow: 0 0 0 0 rgba(249, 115, 22, 0); }
        }

        .loading-dots:after { content: '.'; animation: dots 1.5s steps(5, end) infinite; }
        @keyframes dots { 0%, 20% { content: '.'; } 40% { content: '..'; } 60% { content: '...'; } 80%, 100% { content: ''; } }

        .modal-overlay { background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); }
        .btn-active-scale:active { transform: scale(0.97); }
    </style>
</head>
<body class="min-h-screen pb-6">

    <div class="max-w-4xl mx-auto px-3 py-4 md:px-6 md:py-10">
        <header class="flex justify-between items-center mb-6">
            <div class="w-10"></div>
            <div class="text-center">
                <h1 class="text-2xl md:text-4xl font-bold gradient-text mb-0.5">AI Chef Master</h1>
                <p class="text-[10px] md:text-base text-gray-500 font-medium italic">"Biến nguyên liệu thành tuyệt tác"</p>
            </div>
            <button id="openSettings" class="w-9 h-9 bg-white shadow-sm border border-orange-100 rounded-full flex items-center justify-center text-gray-400 hover:text-orange-500 transition-all btn-active-scale">
                <i class="fas fa-cog text-lg"></i>
            </button>
        </header>

        <!-- API Settings Modal -->
        <div id="settingsModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay">
            <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl overflow-hidden">
                <div class="p-4 border-b border-gray-50 flex justify-between items-center">
                    <h3 class="font-bold text-base text-gray-800">Cài đặt API (Cloud Sync)</h3>
                    <button id="closeSettings" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-100 text-gray-400"><i class="fas fa-times"></i></button>
                </div>
                <div class="p-5 space-y-4">
                    <div class="bg-blue-50 p-3 rounded-xl border border-blue-100">
                        <p class="text-[10px] text-blue-700 font-bold leading-tight">
                            <i class="fas fa-cloud-upload-alt mr-1"></i> Đồng bộ đám mây cho tất cả thiết bị.
                        </p>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-gray-400 uppercase mb-2 tracking-wider">Google Gemini API Key</label>
                        <input type="password" id="apiKeyInput" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-orange-500/20 focus:border-orange-500 outline-none transition-all font-mono text-sm" placeholder="Nhập API key...">
                    </div>
                    <button id="saveSettings" class="w-full bg-orange-500 text-white font-bold py-3.5 rounded-xl hover:bg-orange-600 shadow-lg shadow-orange-500/30 transition-all btn-active-scale">
                        LƯU & ĐỒNG BỘ
                    </button>
                </div>
            </div>
        </div>

        <!-- Main Interface -->
        <div class="bg-white rounded-[1.5rem] md:rounded-[2.5rem] shadow-xl shadow-orange-900/5 overflow-hidden border border-orange-50 mb-6">
            <div class="p-4 md:p-10">
                
                <!-- Quick Controls -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-6">
                    <div id="fridgeCard" class="flex items-center justify-between p-4 bg-orange-50/50 rounded-2xl border border-orange-100/50 pulse-orange">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl bg-orange-500 flex items-center justify-center text-white">
                                <i class="fas fa-snowflake text-lg"></i>
                            </div>
                            <div>
                                <span class="block font-bold text-orange-900 text-sm leading-none">Dọn tủ lạnh</span>
                                <span class="text-[9px] text-orange-600/70 font-medium">Tìm món từ đồ có sẵn</span>
                            </div>
                        </div>
                        <label class="switch">
                            <input type="checkbox" id="fridgeToggle">
                            <span class="slider"></span>
                        </label>
                    </div>

                    <div class="flex items-center justify-between p-4 bg-blue-50/50 rounded-2xl border border-blue-100/50">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl bg-blue-500 flex items-center justify-center text-white">
                                <i class="fas fa-camera text-lg"></i>
                            </div>
                            <div>
                                <span class="block font-bold text-blue-900 text-sm leading-none">Quét ảnh</span>
                                <span class="text-[9px] text-blue-600/70 font-medium">Nhận diện qua hình ảnh</span>
                            </div>
                        </div>
                        <button onclick="document.getElementById('imageInput').click()" class="bg-white border border-blue-100 text-blue-600 px-3 py-1.5 rounded-xl text-[10px] font-bold hover:bg-blue-500 hover:text-white transition-all btn-active-scale shadow-sm">Chọn</button>
                        <input type="file" id="imageInput" class="hidden" accept="image/*">
                    </div>
                </div>

                <!-- Input Zone: Fridge -->
                <div id="ingredientsSection" class="hidden mb-6 animate-in slide-in-from-top-4 duration-300">
                    <div class="bg-gradient-to-br from-orange-50 to-orange-100/30 border border-orange-200 rounded-2xl p-4 shadow-inner">
                        <label class="block text-xs font-black text-orange-800 mb-2 ml-1 flex items-center gap-2">
                            <i class="fas fa-magic text-orange-500"></i> NGUYÊN LIỆU ĐANG CÓ:
                        </label>
                        <input type="text" id="fridgeIngredients" class="w-full p-3.5 bg-white border border-orange-200 rounded-xl outline-none focus:ring-2 focus:ring-orange-500/10 focus:border-orange-500 text-sm font-bold text-gray-700" placeholder="VD: cá hồi, măng tây, tỏi...">
                    </div>
                </div>

                <!-- Image Preview -->
                <div id="imagePreviewContainer" class="hidden mb-6 relative animate-in zoom-in duration-300">
                    <img id="imagePreview" src="" class="w-full h-48 object-cover rounded-2xl border-2 border-white shadow-lg">
                    <button id="removeImage" class="absolute -top-2 -right-2 bg-red-500 text-white w-8 h-8 rounded-full flex items-center justify-center shadow-lg border-2 border-white btn-active-scale"><i class="fas fa-times"></i></button>
                </div>

                <div class="grid grid-cols-2 gap-3 mb-6">
                    <div>
                        <label class="block text-[9px] font-black text-gray-400 mb-1.5 uppercase tracking-wider ml-1">Độ khó</label>
                        <div class="relative">
                            <select id="complexity" class="w-full p-3.5 bg-gray-50 border border-gray-100 rounded-xl outline-none focus:border-orange-300 text-xs font-bold text-gray-700 appearance-none">
                                <option value="Dễ (cho người mới bắt đầu)">🌟 Dễ</option>
                                <option value="Trung bình (kiến thức cơ bản)" selected>🏠 Gia đình</option>
                                <option value="Khó (yêu cầu kỹ thuật cao)">👨‍🍳 Chuyên gia</option>
                            </select>
                            <i class="fas fa-chevron-down absolute right-3 top-1/2 -translate-y-1/2 text-gray-300 pointer-events-none"></i>
                        </div>
                    </div>
                    <div>
                        <label class="block text-[9px] font-black text-gray-400 mb-1.5 uppercase tracking-wider ml-1">Giọng điệu</label>
                        <div class="relative">
                            <select id="persona" class="w-full p-3.5 bg-gray-50 border border-gray-100 rounded-xl outline-none focus:border-blue-300 text-xs font-bold text-gray-700 appearance-none">
                                <option value="Thân thiện" selected>🌟 Thân thiện</option>
                                <option value="Bếp trưởng chuyên nghiệp">👨‍🍳 Chuyên gia</option>
                                <option value="Hài hước">🤣 Hài hước</option>
                            </select>
                            <i class="fas fa-chevron-down absolute right-3 top-1/2 -translate-y-1/2 text-gray-300 pointer-events-none"></i>
                        </div>
                    </div>
                </div>

                <div class="mb-6">
                    <label class="block text-[9px] font-black text-gray-400 mb-1.5 uppercase tracking-wider ml-1">Bạn muốn ăn gì?</label>
                    <textarea id="userInput" rows="2" class="w-full p-4 bg-gray-50 border border-gray-100 rounded-2xl outline-none focus:border-orange-400 text-sm font-bold text-gray-700" placeholder="VD: Món gì đó cay cay từ thịt bò..."></textarea>
                </div>

                <div class="flex flex-col gap-3">
                    <button id="generateBtn" class="bg-orange-500 hover:bg-orange-600 text-white font-black py-4 rounded-2xl shadow-lg shadow-orange-500/20 flex items-center justify-center gap-2 transition-all btn-active-scale text-base">
                        <i class="fas fa-fire-alt"></i> NẤU NGAY!
                    </button>
                    <button id="generateImgBtn" class="bg-amber-50 hover:bg-amber-100 text-amber-700 font-bold py-3.5 rounded-2xl flex items-center justify-center gap-2 transition-all btn-active-scale border border-amber-200 text-sm">
                        <i class="fas fa-magic text-xs"></i> XEM ẢNH MINH HỌA
                    </button>
                </div>

                <!-- Response Area -->
                <div id="resultContainer" class="hidden mt-8 space-y-4 animate-in fade-in duration-500">
                    <img id="dishImage" class="hidden w-full max-h-[400px] object-cover rounded-2xl shadow-lg border-4 border-white" src="">
                    <div class="bg-white p-4 md:p-10 rounded-2xl md:rounded-[2.5rem] border border-orange-100 shadow-lg relative overflow-hidden">
                        <div id="aiResponse" class="relative z-10"></div>
                    </div>
                </div>

                <div id="loadingState" class="hidden text-center py-10">
                    <div class="inline-block p-6 bg-orange-50 rounded-full mb-4">
                        <i class="fas fa-utensils text-3xl text-orange-500 animate-spin"></i>
                    </div>
                    <p class="text-orange-600 font-black uppercase text-[10px] tracking-widest">Chef đang sáng tạo<span class="loading-dots"></span></p>
                </div>
            </div>
        </div>

        <!-- History -->
        <div class="bg-white rounded-2xl md:rounded-[2.5rem] shadow-lg p-5 md:p-8 border border-gray-50">
            <h2 class="text-lg md:text-2xl font-black text-gray-800 mb-5 flex items-center gap-3">
                <i class="fas fa-history text-orange-400 text-base"></i> Sổ tay bếp
            </h2>
            <div id="historyList" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 max-h-[500px] overflow-y-auto">
                <p class="col-span-full text-center text-gray-400 py-10 text-xs italic">Đang đồng bộ...</p>
            </div>
        </div>
    </div>

    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-[100] bg-gray-900/90 text-white px-6 py-3 rounded-full text-[10px] font-black shadow-2xl transition-all duration-500 opacity-0 translate-y-10 border border-gray-700 text-center w-[80%] max-w-xs"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, addDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBe6c5S5184DmWzjqRvcMkEBwN_UJ1zLD8",
            authDomain: "ainauan-f11d0.firebaseapp.com",
            projectId: "ainauan-f11d0",
            storageBucket: "ainauan-f11d0.firebasestorage.app",
            messagingSenderId: "855598869176",
            appId: "1:855598869176:web:462b821ab92fb7eba1624d"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = 'cooking-master-app-v2';

        let user = null;
        let base64Image = null;
        let lastDishName = ""; 
        let userApiKey = "";

        const aiResponse = document.getElementById('aiResponse');
        const loadingState = document.getElementById('loadingState');
        const resultContainer = document.getElementById('resultContainer');
        const historyList = document.getElementById('historyList');
        const dishImage = document.getElementById('dishImage');
        const userInput = document.getElementById('userInput');
        const complexitySelect = document.getElementById('complexity');
        const personaSelect = document.getElementById('persona');
        const fridgeToggle = document.getElementById('fridgeToggle');
        const fridgeIngredients = document.getElementById('fridgeIngredients');
        const ingredientsSection = document.getElementById('ingredientsSection');

        const initApp = async () => {
            try {
                await signInAnonymously(auth);
                onAuthStateChanged(auth, async (u) => {
                    user = u;
                    if (user) {
                        await syncApiKeyFromCloud();
                        loadHistory(); 
                    }
                });
            } catch (err) { console.error("Auth error:", err); }
        };
        initApp();

        async function syncApiKeyFromCloud() {
            try {
                const configRef = doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'global_config');
                const docSnap = await getDoc(configRef);
                if (docSnap.exists()) {
                    userApiKey = docSnap.data().gemini_key;
                    document.getElementById('apiKeyInput').value = userApiKey;
                }
            } catch (err) { console.error("Lỗi lấy config:", err); }
        }

        async function saveApiKeyToCloud(key) {
            if (!user) return;
            try {
                const configRef = doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'global_config');
                await setDoc(configRef, { gemini_key: key, updatedAt: serverTimestamp() }, { merge: true });
                userApiKey = key;
                showToast("☁️ ĐÃ ĐỒNG BỘ!");
            } catch (err) { showToast("LỖI ĐỒNG BỘ!"); }
        }

        function loadHistory() {
            if (!user) return;
            const historyRef = collection(db, 'artifacts', appId, 'public', 'data', 'history_records');
            onSnapshot(historyRef, (snap) => {
                const docs = snap.docs.map(d => ({id: d.id, ...d.data()}));
                const sortedDocs = docs.sort((a,b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
                if (sortedDocs.length === 0) {
                    historyList.innerHTML = '<p class="col-span-full text-center text-gray-400 py-10 text-xs italic">Sổ tay trống...</p>';
                    return;
                }
                historyList.innerHTML = sortedDocs.map(doc => `
                    <div onclick="viewHistory('${btoa(encodeURIComponent(doc.rawMarkdown))}', '${doc.dishName.replace(/'/g, "\\'")}')" class="p-4 bg-gray-50/50 rounded-xl border border-gray-100 cursor-pointer hover:bg-white hover:border-orange-200 transition-all btn-active-scale overflow-hidden">
                        <h4 class="font-bold text-gray-800 text-xs truncate mb-1">${doc.dishName}</h4>
                        <div class="flex items-center gap-2 text-[8px] text-gray-400 font-bold uppercase">
                            <i class="far fa-calendar-alt"></i>
                            ${doc.createdAt ? new Date(doc.createdAt.seconds*1000).toLocaleDateString('vi-VN') : '...'}
                        </div>
                    </div>
                `).join('');
            }, (error) => console.error("Firestore Listen Error:", error));
        }

        window.viewHistory = (encoded, name) => {
            const raw = decodeURIComponent(atob(encoded));
            aiResponse.innerHTML = marked.parse(raw);
            lastDishName = name;
            dishImage.classList.add('hidden');
            resultContainer.classList.remove('hidden');
            window.scrollTo({top: resultContainer.offsetTop - 20, behavior: 'smooth'});
        };

        fridgeToggle.addEventListener('change', function() {
            ingredientsSection.classList.toggle('hidden', !this.checked);
            if (this.checked) document.getElementById('fridgeCard').classList.remove('pulse-orange');
        });

        document.getElementById('openSettings').onclick = () => document.getElementById('settingsModal').classList.remove('hidden');
        document.getElementById('closeSettings').onclick = () => document.getElementById('settingsModal').classList.add('hidden');
        document.getElementById('saveSettings').onclick = async () => {
            const newKey = document.getElementById('apiKeyInput').value.trim();
            if (!newKey) return showToast("NHẬP KEY!");
            await saveApiKeyToCloud(newKey);
            document.getElementById('settingsModal').classList.add('hidden');
        };

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.classList.remove('opacity-0', 'translate-y-10');
            setTimeout(() => t.classList.add('opacity-0', 'translate-y-10'), 2500);
        }

        const exponentialBackoff = async (fn, retries = 5) => {
            for (let i = 0; i < retries; i++) {
                try { return await fn(); } catch (err) {
                    if (i === retries - 1) throw err;
                    await new Promise(r => setTimeout(r, Math.pow(2, i) * 1000));
                }
            }
        };

        document.getElementById('generateBtn').onclick = async () => {
            if (!userInput.value && !base64Image && !fridgeIngredients.value) return showToast("NHẬP THÔNG TIN!");
            if (!userApiKey) {
                showToast("CẦN API KEY!");
                return document.getElementById('settingsModal').classList.remove('hidden');
            }

            loadingState.classList.remove('hidden');
            resultContainer.classList.add('hidden');

            try {
                const systemPrompt = `BẠN LÀ ĐẦU BẾP AI. GIỌNG ĐIỆU: ${personaSelect.value}. TRÌNH ĐỘ: ${complexitySelect.value}. ƯU TIÊN NGUYÊN LIỆU TRONG TỦ. TRÌNH BÀY MARKDOWN, TABLE. TIÊU ĐỀ: ### [Tên món].`;
                let fullUserPrompt = userInput.value || "Gợi ý món ăn.";
                if (fridgeToggle.checked && fridgeIngredients.value) fullUserPrompt = `[DỌN TỦ LẠNH] Tôi có: ${fridgeIngredients.value}. ${fullUserPrompt}`;

                const promptParts = [{ text: fullUserPrompt }];
                if (base64Image) promptParts.push({ inlineData: { mimeType: "image/png", data: base64Image } });

                const callGemini = async () => {
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${userApiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ role: "user", parts: promptParts }], systemInstruction: { parts: [{ text: systemPrompt }] } })
                    });
                    if (!res.ok) throw new Error("API fail");
                    return await res.json();
                };

                const data = await exponentialBackoff(callGemini);
                const rawMarkdown = data.candidates[0].content.parts[0].text;
                lastDishName = (rawMarkdown.match(/### (.*)/)?.[1] || "Món ngon AI").trim();

                aiResponse.innerHTML = marked.parse(rawMarkdown);

                if (user) {
                    const historyRef = collection(db, 'artifacts', appId, 'public', 'data', 'history_records');
                    await addDoc(historyRef, { dishName: lastDishName, rawMarkdown: rawMarkdown, createdAt: serverTimestamp() });
                }
                
                resultContainer.classList.remove('hidden');
                window.scrollTo({top: resultContainer.offsetTop - 20, behavior: 'smooth'});
            } catch (err) { showToast("LỖI API!"); } finally { loadingState.classList.add('hidden'); }
        };

        document.getElementById('generateImgBtn').onclick = async () => {
            if (!lastDishName || !userApiKey) return showToast("CẦN CÔNG THỨC TRƯỚC!");
            dishImage.classList.add('hidden');
            showToast("📸 ĐANG TẠO ẢNH...");
            try {
                const callImagen = async () => {
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${userApiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ instances: { prompt: `Gourmet food photo of ${lastDishName}, studio lighting, high resolution` }, parameters: { sampleCount: 1 } })
                    });
                    if (!res.ok) throw new Error("Image API fail");
                    return await res.json();
                };
                const data = await exponentialBackoff(callImagen);
                if (data.predictions?.[0]) {
                    dishImage.src = `data:image/png;base64,${data.predictions[0].bytesBase64Encoded}`;
                    dishImage.classList.remove('hidden');
                }
            } catch (err) { showToast("LỖI TẠO ẢNH."); }
        };

        document.getElementById('imageInput').onchange = e => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = ev => {
                    base64Image = ev.target.result.split(',')[1];
                    document.getElementById('imagePreview').src = ev.target.result;
                    document.getElementById('imagePreviewContainer').classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        };
        document.getElementById('removeImage').onclick = () => {
            base64Image = null;
            document.getElementById('imageInput').value = "";
            document.getElementById('imagePreviewContainer').classList.add('hidden');
        };
    </script>
</body>
</html>
