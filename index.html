<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Chef Master - Quản Lý Bữa Ăn Chuyên Nghiệp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');
        
        :root {
            --primary-orange: #f97316;
            --secondary-amber: #fbbf24;
            --chef-dark: #7c2d12;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background: #fdf6f0;
            -webkit-tap-highlight-color: transparent;
        }

        .gradient-text {
            background: linear-gradient(90deg, var(--primary-orange), var(--secondary-amber));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Nâng cấp Markdown Styling - Làm nổi bật tiêu đề */
        #aiResponse {
            font-family: 'Inter', sans-serif;
            color: #374151;
            line-height: 1.8;
        }
        
        #aiResponse h1 {
            font-size: 2rem;
            font-weight: 800;
            color: var(--chef-dark);
            margin: 1rem 0 1.5rem 0;
            text-align: center;
            line-height: 1.2;
            text-transform: uppercase;
            border-bottom: 4px solid var(--secondary-amber);
            padding-bottom: 10px;
        }

        #aiResponse h2 {
            font-size: 1.4rem;
            font-weight: 700;
            color: #9a3412;
            margin: 2.5rem 0 1rem 0;
            padding-left: 12px;
            border-left: 5px solid var(--primary-orange);
            background: #fff7ed;
            padding-top: 8px;
            padding-bottom: 8px;
            border-radius: 0 8px 8px 0;
        }

        #aiResponse h3 {
            font-size: 1.1rem;
            font-weight: 700;
            color: #c2410c;
            margin: 1.5rem 0 0.5rem 0;
            display: flex;
            align-items: center;
        }

        #aiResponse h3::before {
            content: "◆";
            margin-right: 8px;
            color: var(--secondary-amber);
        }

        #aiResponse p { margin-bottom: 1.2rem; }

        /* Shopping List UI */
        #shoppingListDrawer {
            transition: transform 0.3s ease-in-out;
            z-index: 100;
        }

        .table-wrapper { margin: 1.5rem 0; }

        #aiResponse table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #fed7aa;
        }

        #aiResponse th {
            background: #fff7ed;
            padding: 12px;
            text-align: left;
            color: #9a3412;
            font-size: 0.8rem;
            font-weight: 800;
            text-transform: uppercase;
            border-bottom: 2px solid #fed7aa;
        }

        #aiResponse td {
            padding: 12px;
            border-bottom: 1px solid #fff7ed;
            font-size: 0.85rem;
        }

        @media (max-width: 640px) {
            #aiResponse table, #aiResponse thead, #aiResponse tbody, #aiResponse th, #aiResponse td, #aiResponse tr { display: block; }
            #aiResponse thead tr { position: absolute; top: -9999px; left: -9999px; }
            #aiResponse tr { border: 1px solid #fed7aa; margin-bottom: 10px; border-radius: 12px; background: #fff; padding: 8px; }
            #aiResponse td { border: none; position: relative; padding-left: 45%; text-align: right; min-height: 38px; display: flex; align-items: center; justify-content: flex-end; }
            #aiResponse td:before { position: absolute; left: 12px; width: 40%; white-space: nowrap; text-align: left; font-weight: 700; color: #9a3412; content: attr(data-label); font-size: 0.75rem; }
        }

        .recipe-meta { display: flex; gap: 8px; margin-bottom: 1.5rem; justify-content: center; flex-wrap: wrap; }
        .meta-badge { background: #fff7ed; color: #c2410c; padding: 4px 12px; border-radius: 99px; font-size: 11px; font-weight: 700; border: 1px solid #ffedd5; text-transform: uppercase; }

        .switch { position: relative; display: inline-block; width: 44px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #cbd5e1; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--primary-orange); }
        input:checked + .slider:before { transform: translateX(22px); }

        .btn-active-scale:active { transform: scale(0.96); }
        .modal-overlay { background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); }
    </style>
</head>
<body class="min-h-screen pb-10">

    <button id="toggleShoppingList" class="fixed bottom-6 right-6 w-14 h-14 bg-orange-600 text-white rounded-full shadow-2xl z-[60] flex items-center justify-center btn-active-scale">
        <i class="fas fa-shopping-basket text-xl"></i>
        <span id="cartCount" class="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] font-bold px-2 py-1 rounded-full">0</span>
    </button>

    <div id="shoppingListDrawer" class="fixed inset-y-0 right-0 w-full md:w-96 bg-white shadow-2xl transform translate-x-full z-[70] flex flex-col">
        <div class="p-6 border-b border-gray-100 flex justify-between items-center bg-orange-50">
            <h3 class="font-black text-orange-900 uppercase tracking-tighter flex items-center gap-2">
                <i class="fas fa-list-ul"></i> Danh sách mua sắm
            </h3>
            <button id="closeShoppingList" class="text-gray-400 hover:text-red-500 transition-colors"><i class="fas fa-times text-xl"></i></button>
        </div>
        <div id="shoppingItemsContainer" class="flex-1 overflow-y-auto p-6 space-y-4">
            <p class="text-center text-gray-400 italic text-sm py-10">Danh sách trống. Hãy thêm nguyên liệu từ công thức!</p>
        </div>
        <div class="p-6 border-t border-gray-100 space-y-3">
            <button id="clearShoppingList" class="w-full py-3 text-xs font-bold text-gray-400 uppercase tracking-widest hover:text-red-500 transition-colors">Xóa tất cả</button>
            <button onclick="window.print()" class="w-full bg-orange-500 text-white font-bold py-4 rounded-xl shadow-lg btn-active-scale">IN DANH SÁCH</button>
        </div>
    </div>

    <div class="max-w-4xl mx-auto px-4 py-6">
        <header class="flex justify-between items-center mb-8">
            <div class="w-10"></div>
            <div class="text-center">
                <h1 class="text-3xl md:text-5xl font-extrabold gradient-text mb-1">AI Chef Master</h1>
                <p class="text-[10px] md:text-xs text-gray-400 font-bold uppercase tracking-widest italic">Nấu ăn cho Chiến</p>
            </div>
            <button id="openSettings" class="w-10 h-10 bg-white shadow-sm rounded-full flex items-center justify-center text-gray-400 hover:text-orange-500 border border-gray-100">
                <i class="fas fa-cog"></i>
            </button>
        </header>

        <div id="settingsModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay">
            <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl overflow-hidden">
                <div class="p-5 border-b border-gray-50 flex justify-between items-center">
                    <h3 class="font-bold text-gray-800 italic">Cấu hình hệ thống</h3>
                    <button id="closeSettings" class="text-gray-400"><i class="fas fa-times"></i></button>
                </div>
                <div class="p-6 space-y-4">
                    <div>
                        <label class="block text-[10px] font-black text-gray-400 uppercase mb-2">Google Gemini API Key</label>
                        <input type="password" id="apiKeyInput" class="w-full p-4 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:border-orange-500 text-sm" placeholder="Dán API key vào đây...">
                    </div>
                    <button id="saveSettings" class="w-full bg-orange-500 text-white font-bold py-4 rounded-xl shadow-lg btn-active-scale">LƯU THÔNG TIN</button>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-[2rem] shadow-xl overflow-hidden border border-orange-50 mb-8">
            <div class="p-6 md:p-10">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                    <div class="flex items-center justify-between p-4 bg-orange-50/40 rounded-2xl border border-orange-100">
                        <div class="flex items-center gap-3">
                            <i class="fas fa-utensils text-orange-500"></i>
                            <span class="font-bold text-orange-900 text-sm">Chế độ "Dọn tủ"</span>
                        </div>
                        <label class="switch">
                            <input type="checkbox" id="fridgeToggle">
                            <span class="slider"></span>
                        </label>
                    </div>

                    <div class="flex items-center justify-between p-4 bg-blue-50/40 rounded-2xl border border-blue-100">
                        <div class="flex items-center gap-3">
                            <i class="fas fa-camera text-blue-500"></i>
                            <span class="font-bold text-blue-900 text-sm">Quét ảnh</span>
                        </div>
                        <button onclick="document.getElementById('imageInput').click()" class="bg-white text-blue-600 px-3 py-1.5 rounded-lg text-[10px] font-black border border-blue-100 uppercase">Chọn ảnh</button>
                        <input type="file" id="imageInput" class="hidden" accept="image/*">
                    </div>
                </div>

                <div id="ingredientsSection" class="hidden mb-6">
                    <div class="bg-gray-50 border border-gray-200 rounded-xl p-4">
                        <label class="block text-[10px] font-black text-gray-400 mb-2 uppercase">Nguyên liệu đang có:</label>
                        <input type="text" id="fridgeIngredients" class="w-full p-3 bg-white border border-gray-200 rounded-lg outline-none text-sm font-bold" placeholder="VD: Trứng, cà chua, hành lá...">
                    </div>
                </div>

                <div id="imagePreviewContainer" class="hidden mb-6 relative">
                    <img id="imagePreview" src="" class="w-full h-48 object-cover rounded-2xl shadow-md">
                    <button id="removeImage" class="absolute top-2 right-2 bg-red-500 text-white w-8 h-8 rounded-full shadow-lg"><i class="fas fa-times"></i></button>
                </div>

                <div class="grid grid-cols-2 gap-4 mb-6">
                    <div class="space-y-1">
                        <label class="text-[10px] font-black text-gray-400 uppercase ml-1 tracking-wider">Độ phức tạp</label>
                        <select id="complexity" class="w-full p-3 bg-gray-50 border border-gray-100 rounded-xl text-xs font-bold text-gray-700 outline-none">
                            <option value="Dễ">🌟 Đơn giản</option>
                            <option value="Trung bình" selected>🏠 Vừa sức</option>
                            <option value="Khó">👨‍🍳 Phức tạp</option>
                        </select>
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px] font-black text-gray-400 uppercase ml-1 tracking-wider">Phong cách Chef</label>
                        <select id="persona" class="w-full p-3 bg-gray-50 border border-gray-100 rounded-xl text-xs font-bold text-gray-700 outline-none">
                            <option value="Chuyên sâu (MasterChef)" selected>👨‍🔬 MasterChef</option>
                            <option value="Thân thiện (Gia đình)">🌿 Thân thiện</option>
                            <option value="Hài hước (Sáng tạo)">🤣 Hài hước</option>
                        </select>
                    </div>
                </div>

                <div class="mb-6">
                    <label class="text-[10px] font-black text-gray-400 uppercase ml-1 block mb-1">Món ăn hoặc yêu cầu riêng</label>
                    <textarea id="userInput" rows="3" class="w-full p-4 bg-gray-50 border border-gray-100 rounded-2xl outline-none focus:border-orange-400 text-sm" placeholder="Hôm nay tôi muốn ăn món gì đó thanh đạm..."></textarea>
                </div>

                <button id="generateBtn" class="w-full bg-orange-500 text-white font-black py-4 rounded-2xl shadow-xl shadow-orange-500/20 flex items-center justify-center gap-2 transition-all btn-active-scale">
                    <i class="fas fa-fire"></i> LÊN THỰC ĐƠN NGAY
                </button>

                <div id="loadingState" class="hidden text-center py-10">
                    <div class="w-12 h-12 border-4 border-orange-500/20 border-t-orange-500 rounded-full animate-spin mx-auto"></div>
                    <p class="mt-4 text-[10px] text-gray-400 font-black uppercase tracking-widest">Đang thiết kế công thức...</p>
                </div>

                <div id="resultContainer" class="hidden mt-10 space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                        <button id="generateImgBtn" class="w-full bg-amber-50 text-amber-700 font-bold py-3 rounded-xl flex items-center justify-center gap-2 border border-amber-100 text-xs transition-all hover:bg-amber-100">
                            <i class="fas fa-magic"></i> XUẤT ẢNH AI
                        </button>
                        <button id="addToListBtn" class="w-full bg-orange-600 text-white font-bold py-3 rounded-xl flex items-center justify-center gap-2 text-xs shadow-lg transition-all hover:bg-orange-700">
                            <i class="fas fa-cart-plus"></i> THÊM VÀO GIỎ MUA SẮM
                        </button>
                    </div>
                    
                    <div id="imageDisplayArea" class="hidden">
                        <div id="imageLoading" class="hidden py-8 text-center bg-gray-50 rounded-2xl border-2 border-dashed border-gray-200">
                             <p class="text-[10px] font-black text-gray-400 uppercase">Đang vẽ hình ảnh món ăn...</p>
                        </div>
                        <img id="dishImage" class="hidden w-full h-64 object-cover rounded-2xl shadow-lg border-4 border-white" src="">
                    </div>

                    <div class="bg-white p-4 md:p-8 rounded-3xl border border-orange-50 shadow-inner">
                        <div id="aiMetaHeader" class="recipe-meta"></div>
                        <div id="aiResponse" class="text-sm"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-3xl shadow-sm p-6 border border-gray-100">
            <h2 class="text-sm font-black text-gray-800 mb-4 flex items-center gap-2 uppercase tracking-tighter">
                <i class="fas fa-book-open text-orange-400"></i> Nhật ký nấu nướng
            </h2>
            <div id="historyList" class="grid grid-cols-1 md:grid-cols-2 gap-3">
                <p class="col-span-full text-center text-gray-400 py-4 italic text-xs">Đang tải nhật ký...</p>
            </div>
        </div>
    </div>

    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-[100] bg-gray-900 text-white px-6 py-3 rounded-full text-[10px] font-bold shadow-2xl transition-all duration-500 opacity-0 translate-y-10"></div>

    <script type="module">
        // Import & Config (GIỮ NGUYÊN)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot, serverTimestamp, addDoc, query } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        
        const firebaseConfig = JSON.parse('{"apiKey":"AIzaSyBe6c5S5184DmWzjqRvcMkEBwN_UJ1zLD8","authDomain":"ainauan-f11d0.firebaseapp.com","projectId":"ainauan-f11d0","storageBucket":"ainauan-f11d0.firebasestorage.app","messagingSenderId":"855598869176","appId":"1:855598869176:web:462b821ab92fb7eba1624d"}');
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const customAppId = 'cooking-master-app-v2';
        const historyCollectionName = 'history_records';
        const configDocPath = 'global_config';

        let user = null;
        let base64Image = null;
        let lastDishName = "";
        let userApiKey = "";
        let shoppingList = JSON.parse(localStorage.getItem('ai_chef_shopping_list') || '[]');

        const showToast = (m) => {
            const t = document.getElementById('toast');
            if (t) {
                t.innerText = m;
                t.classList.remove('opacity-0', 'translate-y-10');
                setTimeout(() => t.classList.add('opacity-0', 'translate-y-10'), 2500);
            }
        };

        // --- SHOPPING LIST LOGIC ---
        const updateShoppingUI = () => {
            const container = document.getElementById('shoppingItemsContainer');
            const cartCount = document.getElementById('cartCount');
            cartCount.innerText = shoppingList.length;

            if (shoppingList.length === 0) {
                container.innerHTML = '<p class="text-center text-gray-400 italic text-sm py-10">Danh sách trống.</p>';
                return;
            }

            container.innerHTML = shoppingList.map((item, idx) => `
                <div class="bg-gray-50 p-4 rounded-xl border border-gray-100">
                    <div class="flex justify-between items-center mb-2">
                        <span class="font-bold text-orange-800 text-xs uppercase">${item.dish}</span>
                        <button onclick="window.removeItem(${idx})" class="text-gray-300 hover:text-red-500"><i class="fas fa-trash"></i></button>
                    </div>
                    <ul class="text-sm space-y-1 text-gray-600">
                        ${item.ingredients.map(ing => `
                            <li class="flex items-center gap-2">
                                <input type="checkbox" class="rounded border-gray-300 text-orange-500 focus:ring-orange-500">
                                <span>${ing}</span>
                            </li>
                        `).join('')}
                    </ul>
                </div>
            `).join('');
            localStorage.setItem('ai_chef_shopping_list', JSON.stringify(shoppingList));
        };

        window.removeItem = (index) => {
            shoppingList.splice(index, 1);
            updateShoppingUI();
        };

        document.getElementById('clearShoppingList').onclick = () => {
            if(confirm('Xóa toàn bộ danh sách?')) {
                shoppingList = [];
                updateShoppingUI();
            }
        };

        document.getElementById('toggleShoppingList').onclick = () => {
            document.getElementById('shoppingListDrawer').classList.remove('translate-x-full');
        };

        document.getElementById('closeShoppingList').onclick = () => {
            document.getElementById('shoppingListDrawer').classList.add('translate-x-full');
        };

        document.getElementById('addToListBtn').onclick = () => {
            const table = document.querySelector('#aiResponse table');
            if (!table) return showToast("Không tìm thấy danh sách nguyên liệu");

            const rows = table.querySelectorAll('tbody tr');
            const ingredients = Array.from(rows).map(row => {
                const cells = row.querySelectorAll('td');
                // Lấy cột nguyên liệu và định lượng (giả định cột 1 và 2)
                return `${cells[0]?.innerText || ''} (${cells[1]?.innerText || ''})`;
            });

            shoppingList.push({
                dish: lastDishName,
                ingredients: ingredients
            });
            updateShoppingUI();
            showToast("Đã thêm vào giỏ mua sắm!");
            document.getElementById('shoppingListDrawer').classList.remove('translate-x-full');
        };

        // --- CORE LOGIC (GIỮ NGUYÊN & CẬP NHẬT PROMPT) ---
        const initAuth = async () => {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    try { await signInWithCustomToken(auth, __initial_auth_token); } 
                    catch (tokenErr) { await signInAnonymously(auth); }
                } else { await signInAnonymously(auth); }
            } catch (error) { console.error("Auth error:", error); }
        };

        onAuthStateChanged(auth, async (u) => {
            user = u;
            if (user) {
                try {
                    const configRef = doc(db, 'artifacts', customAppId, 'public', 'data', 'settings', configDocPath);
                    const snap = await getDoc(configRef);
                    if (snap.exists()) {
                        userApiKey = snap.data().apiKey;
                        document.getElementById('apiKeyInput').value = userApiKey || "";
                    }
                } catch (e) { console.warn("Config not found"); }
                setupHistoryListener();
                updateShoppingUI();
            } else { initAuth(); }
        });

        // (setupHistoryListener, renderHistory, loadContent, processTables - GIỮ NGUYÊN)
        const setupHistoryListener = () => {
            if (!user) return;
            const historyRef = collection(db, 'artifacts', customAppId, 'public', 'data', historyCollectionName);
            onSnapshot(historyRef, (snapshot) => {
                const items = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                items.sort((a, b) => (b.createdAt?.toMillis() || 0) - (a.createdAt?.toMillis() || 0));
                renderHistory(items);
            }, (error) => {
                document.getElementById('historyList').innerHTML = `<p class="text-red-400 text-xs italic">Lỗi kết nối.</p>`;
            });
        };

        const renderHistory = (items) => {
            const list = document.getElementById('historyList');
            if (items.length === 0) {
                list.innerHTML = '<p class="col-span-full text-center text-gray-400 py-4 italic text-xs">Chưa có nhật ký.</p>';
                return;
            }
            list.innerHTML = items.map(item => {
                const encoded = btoa(encodeURIComponent(item.content));
                const date = item.createdAt ? new Date(item.createdAt.toMillis()).toLocaleDateString('vi-VN') : 'Mới';
                const displayTitle = item.dishName || item.title || "Công thức không tên";
                return `
                    <div class="p-4 bg-gray-50 rounded-xl border border-gray-100 cursor-pointer hover:border-orange-200 transition-all group" 
                         onclick="window.loadContent('${encoded}', '${displayTitle.replace(/'/g, "\\'")}')">
                        <div class="flex justify-between items-start">
                            <h4 class="font-bold text-gray-700 text-xs truncate flex-1">${displayTitle}</h4>
                            <i class="fas fa-chevron-right text-[10px] text-gray-300 group-hover:text-orange-400 ml-2"></i>
                        </div>
                        <p class="text-[8px] text-gray-400 mt-1 font-bold">${date}</p>
                    </div>
                `;
            }).join('');
        };

        window.loadContent = (encoded, title) => {
            try {
                const raw = decodeURIComponent(atob(encoded));
                document.getElementById('aiMetaHeader').innerHTML = "";
                document.getElementById('aiResponse').innerHTML = marked.parse(raw);
                processTables();
                lastDishName = title;
                document.getElementById('imageDisplayArea').classList.add('hidden');
                document.getElementById('resultContainer').classList.remove('hidden');
                window.scrollTo({top: document.getElementById('resultContainer').offsetTop - 20, behavior: 'smooth'});
            } catch (e) { showToast("Lỗi tải"); }
        };

        const processTables = () => {
            const responseDiv = document.getElementById('aiResponse');
            const tables = responseDiv.querySelectorAll('table');
            tables.forEach(table => {
                const headers = Array.from(table.querySelectorAll('th')).map(th => th.innerText);
                const rows = table.querySelectorAll('tbody tr');
                rows.forEach(row => {
                    const cells = row.querySelectorAll('td');
                    cells.forEach((cell, index) => {
                        if (headers[index]) cell.setAttribute('data-label', headers[index]);
                    });
                });
                if (!table.parentElement.classList.contains('table-wrapper')) {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'table-wrapper';
                    table.parentNode.insertBefore(wrapper, table);
                    wrapper.appendChild(table);
                }
            });
        };

        // (API FETCH & ACTIONS)
        document.getElementById('saveSettings').onclick = async () => {
            const key = document.getElementById('apiKeyInput').value.trim();
            try {
                await setDoc(doc(db, 'artifacts', customAppId, 'public', 'data', 'settings', configDocPath), { apiKey: key, updatedAt: serverTimestamp() });
                userApiKey = key; showToast("Đã lưu API Key"); document.getElementById('settingsModal').classList.add('hidden');
            } catch (e) { showToast("Lỗi lưu"); }
        };

        document.getElementById('openSettings').onclick = () => document.getElementById('settingsModal').classList.remove('hidden');
        document.getElementById('closeSettings').onclick = () => document.getElementById('settingsModal').classList.add('hidden');
        document.getElementById('fridgeToggle').onchange = (e) => document.getElementById('ingredientsSection').classList.toggle('hidden', !e.target.checked);

        async function fetchGemini(url, payload) {
            let delay = 1000;
            for (let i = 0; i < 5; i++) {
                try {
                    const response = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                    if (response.ok) return await response.json();
                } catch (err) { if (i === 4) throw err; await new Promise(r => setTimeout(r, delay)); delay *= 2; }
            }
        }

        document.getElementById('generateBtn').onclick = async () => {
            if (!userApiKey) return showToast("Cần nhập API Key");
            const userInput = document.getElementById('userInput').value;
            const ingredients = document.getElementById('fridgeIngredients').value;
            const complexity = document.getElementById('complexity').value;
            const persona = document.getElementById('persona').value;

            document.getElementById('loadingState').classList.remove('hidden');
            document.getElementById('resultContainer').classList.add('hidden');

            // Cập nhật System Instruction để làm nổi bật cấu trúc
            const systemInstruction = `Bạn là một Chef chuyên nghiệp phong cách "${persona}".
            Thiết kế món ăn độ khó "${complexity}".
            Cấu trúc phản hồi (SỬ DỤNG ĐÚNG CẤP ĐỘ TIÊU ĐỀ):
            # [Tên món ăn - Viết In Hoa]
            ## Tổng quan & Độ khó
            ## Nguyên liệu (Bắt buộc dùng Table Markdown: | Nguyên liệu | Định lượng | Ghi chú |)
            ## Giai đoạn Chế biến (Sử dụng tiêu đề ### cho mỗi giai đoạn lớn như Sơ chế, Chế biến, Trình bày)
            ## Bí quyết từ Chef ${persona} (Dùng tiêu đề ##)
            Lưu ý: Các bước thực hiện phải đánh số rõ ràng, xuống dòng để dễ đọc trên di động.`;

            try {
                let prompt = userInput || "Gợi ý một món ăn ngon.";
                if (document.getElementById('fridgeToggle').checked) prompt = `Nguyên liệu: ${ingredients}. Yêu cầu: ${prompt}`;
                
                const contents = [{ role: "user", parts: [{ text: prompt }] }];
                if (base64Image) contents[0].parts.push({ inlineData: { mimeType: "image/png", data: base64Image } });

                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${userApiKey}`;
                const data = await fetchGemini(url, { contents, systemInstruction: { parts: [{ text: systemInstruction }] } });
                const text = data.candidates?.[0]?.content?.parts?.[0]?.text || "";
                
                const lines = text.split('\n');
                let extractedName = "";
                for(let line of lines) { if(line.trim().startsWith('#')) { extractedName = line.replace(/#/g, '').trim(); break; } }
                lastDishName = extractedName || "Món ăn từ AI";

                document.getElementById('aiMetaHeader').innerHTML = `
                    <span class="meta-badge"><i class="fas fa-signal mr-1"></i> ${complexity}</span>
                    <span class="meta-badge"><i class="fas fa-user-tie mr-1"></i> ${persona}</span>
                `;
                document.getElementById('aiResponse').innerHTML = marked.parse(text);
                processTables();
                document.getElementById('resultContainer').classList.remove('hidden');

                if (user) {
                    await addDoc(collection(db, 'artifacts', customAppId, 'public', 'data', historyCollectionName), {
                        dishName: lastDishName, title: lastDishName, content: text, complexity, persona, createdAt: serverTimestamp()
                    });
                }
                window.scrollTo({top: document.getElementById('resultContainer').offsetTop - 20, behavior: 'smooth'});
            } catch (e) { showToast("Lỗi: " + e.message); } finally { document.getElementById('loadingState').classList.add('hidden'); }
        };

        // (Image Gen & Input - GIỮ NGUYÊN)
        document.getElementById('generateImgBtn').onclick = async () => {
            if (!lastDishName || !userApiKey) return;
            document.getElementById('imageDisplayArea').classList.remove('hidden');
            document.getElementById('imageLoading').classList.remove('hidden');
            document.getElementById('dishImage').classList.add('hidden');
            try {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${userApiKey}`;
                const data = await fetchGemini(url, { instances: [{ prompt: `Professional food photography of ${lastDishName}, 4k, gourmet plating, warm lighting` }], parameters: { sampleCount: 1 } });
                if (data.predictions?.[0]?.bytesBase64Encoded) {
                    document.getElementById('dishImage').src = `data:image/png;base64,${data.predictions[0].bytesBase64Encoded}`;
                    document.getElementById('dishImage').classList.remove('hidden');
                    document.getElementById('imageLoading').classList.add('hidden');
                }
            } catch (e) { showToast("Lỗi tạo ảnh."); document.getElementById('imageDisplayArea').classList.add('hidden'); }
        };

        document.getElementById('imageInput').onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    base64Image = ev.target.result.split(',')[1];
                    document.getElementById('imagePreview').src = ev.target.result;
                    document.getElementById('imagePreviewContainer').classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        };

        document.getElementById('removeImage').onclick = () => {
            base64Image = null;
            document.getElementById('imagePreviewContainer').classList.add('hidden');
        };
    </script>
</body>
</html>
