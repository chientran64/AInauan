<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Chef Master - Sổ Tay Nấu Nướng Chuyên Nghiệp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');
        
        :root {
            --primary-orange: #f97316;
            --secondary-amber: #fbbf24;
            --chef-dark: #7c2d12;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background: #fdf6f0;
            -webkit-tap-highlight-color: transparent;
        }

        .gradient-text {
            background: linear-gradient(90deg, var(--primary-orange), var(--secondary-amber));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Markdown Styling */
        #aiResponse { font-family: 'Inter', sans-serif; color: #374151; line-height: 1.8; }
        #aiResponse h1 { font-size: 1.8rem; font-weight: 800; color: var(--chef-dark); margin: 1.5rem 0; text-align: center; border-bottom: 3px double var(--secondary-amber); padding-bottom: 12px; }
        #aiResponse h2 { font-size: 1.3rem; font-weight: 800; color: #9a3412; margin: 2rem 0 1rem 0; padding: 10px 15px; border-left: 6px solid var(--primary-orange); background: linear-gradient(to right, #fff7ed, transparent); border-radius: 4px; text-transform: uppercase; }
        #aiResponse h3 { font-size: 1.1rem; font-weight: 700; color: #c2410c; margin: 1.5rem 0 0.8rem 0; text-decoration: underline; text-underline-offset: 4px; text-decoration-color: #fed7aa; }
        #aiResponse p { margin-bottom: 1.2rem; }
        #aiResponse blockquote { background: #fffbeb; border-left: 4px solid var(--secondary-amber); padding: 1rem; margin: 1.5rem 0; font-style: italic; border-radius: 0 12px 12px 0; }

        /* Shopping List Drawer */
        #shoppingListDrawer { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); z-index: 100; }

        /* Table Styling */
        .table-wrapper { margin: 1.5rem 0; overflow-x: auto; }
        #aiResponse table { width: 100%; border-collapse: collapse; background: white; border-radius: 12px; overflow: hidden; border: 1px solid #fed7aa; }
        #aiResponse th { background: #fff7ed; padding: 12px; text-align: left; color: #9a3412; font-size: 0.75rem; font-weight: 800; text-transform: uppercase; border-bottom: 2px solid #fed7aa; }
        #aiResponse td { padding: 12px; border-bottom: 1px solid #fff7ed; font-size: 0.85rem; }

        @media (max-width: 640px) {
            #aiResponse table, #aiResponse thead, #aiResponse tbody, #aiResponse th, #aiResponse td, #aiResponse tr { display: block; }
            #aiResponse thead tr { position: absolute; top: -9999px; left: -9999px; }
            #aiResponse tr { border-bottom: 2px solid #fed7aa; margin-bottom: 5px; background: #fff; padding: 8px; }
            #aiResponse td { border: none; position: relative; padding-left: 45%; text-align: right; min-height: 38px; display: flex; align-items: center; justify-content: flex-end; }
            #aiResponse td:before { position: absolute; left: 12px; width: 40%; white-space: nowrap; text-align: left; font-weight: 700; color: #9a3412; content: attr(data-label); font-size: 0.75rem; }
        }

        .recipe-meta { display: flex; gap: 8px; margin-bottom: 1.5rem; justify-content: center; flex-wrap: wrap; }
        .meta-badge { background: #fff7ed; color: #c2410c; padding: 4px 12px; border-radius: 99px; font-size: 11px; font-weight: 700; border: 1px solid #ffedd5; text-transform: uppercase; }

        .switch { position: relative; display: inline-block; width: 44px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #cbd5e1; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--primary-orange); }
        input:checked + .slider:before { transform: translateX(22px); }

        .btn-active-scale:active { transform: scale(0.96); }
        .modal-overlay { background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .item-animate { animation: slideIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="min-h-screen pb-10">

    <!-- Shopping List Button & Counter -->
    <button id="toggleShoppingList" class="fixed bottom-6 right-6 w-14 h-14 bg-orange-600 text-white rounded-full shadow-2xl z-[60] flex items-center justify-center btn-active-scale border-4 border-white">
        <i class="fas fa-shopping-basket text-xl"></i>
        <span id="cartCount" class="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] font-bold px-2 py-1 rounded-full border-2 border-white">0</span>
    </button>

    <!-- Side Drawer -->
    <div id="shoppingListDrawer" class="fixed inset-y-0 right-0 w-full md:w-96 bg-white shadow-2xl transform translate-x-full z-[70] flex flex-col">
        <div class="p-6 border-b border-gray-100 flex justify-between items-center bg-orange-50">
            <div>
                <h3 class="font-black text-orange-900 uppercase tracking-tighter flex items-center gap-2">
                    <i class="fas fa-list-check"></i> Danh sách mua sắm
                </h3>
                <p class="text-[10px] text-orange-700 font-bold uppercase mt-1">Lấy từ các món vừa tìm thấy</p>
            </div>
            <button id="closeShoppingList" class="text-gray-400 hover:text-red-500 p-2"><i class="fas fa-times text-xl"></i></button>
        </div>
        <div id="shoppingItemsContainer" class="flex-1 overflow-y-auto p-6 space-y-4 bg-gray-50/50">
            <div class="text-center py-20 text-gray-300">
                <i class="fas fa-cart-shopping text-5xl mb-4"></i>
                <p class="italic text-sm">Chưa có dữ liệu.</p>
            </div>
        </div>
        <div class="p-6 border-t border-gray-100 bg-white">
            <button id="clearShoppingList" class="w-full py-2 mb-3 text-[10px] font-black text-gray-400 uppercase tracking-widest hover:text-red-500">Xóa danh sách</button>
            <button onclick="window.print()" class="w-full bg-orange-500 text-white font-bold py-4 rounded-xl shadow-lg btn-active-scale flex items-center justify-center gap-2">
                <i class="fas fa-print"></i> IN DANH SÁCH
            </button>
        </div>
    </div>

    <div class="max-w-4xl mx-auto px-4 py-6">
        <header class="flex justify-between items-center mb-8">
            <div class="w-10"></div>
            <div class="text-center">
                <h1 class="text-3xl md:text-5xl font-extrabold gradient-text mb-1 italic">HÔM NAY ĂN GÌ</h1>
                <p class="text-[10px] md:text-xs text-gray-400 font-bold uppercase tracking-[0.2em] italic">Nấu ăn cho Chiến</p>
            </div>
            <button id="openSettings" class="w-10 h-10 bg-white shadow-sm rounded-full flex items-center justify-center text-gray-400 hover:text-orange-500 border border-gray-100">
                <i class="fas fa-cog"></i>
            </button>
        </header>

        <!-- Settings Modal -->
        <div id="settingsModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay">
            <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl">
                <div class="p-5 border-b flex justify-between items-center">
                    <h3 class="font-bold text-gray-800 uppercase text-xs tracking-widest">Cấu hình API</h3>
                    <button id="closeSettings" class="text-gray-400"><i class="fas fa-times"></i></button>
                </div>
                <div class="p-6 space-y-4">
                    <input type="password" id="apiKeyInput" class="w-full p-4 bg-gray-50 border rounded-xl outline-none focus:border-orange-500 text-sm" placeholder="Nhập API key...">
                    <button id="saveSettings" class="w-full bg-orange-500 text-white font-bold py-4 rounded-xl shadow-lg">LƯU CẤU HÌNH</button>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-[2rem] shadow-xl overflow-hidden border border-orange-50 mb-8">
            <div class="p-6 md:p-10">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                    <div class="flex items-center justify-between p-4 bg-orange-50/40 rounded-2xl border border-orange-100">
                        <div class="flex items-center gap-3">
                            <i class="fas fa-box-open text-orange-500"></i>
                            <span class="font-bold text-orange-900 text-sm italic">Chế độ dọn tủ lạnh</span>
                        </div>
                        <label class="switch"><input type="checkbox" id="fridgeToggle"><span class="slider"></span></label>
                    </div>
                    <div class="flex items-center justify-between p-4 bg-blue-50/40 rounded-2xl border border-blue-100">
                        <div class="flex items-center gap-3">
                            <i class="fas fa-camera-retro text-blue-500"></i>
                            <span class="font-bold text-blue-900 text-sm italic">Quét nguyên liệu</span>
                        </div>
                        <button onclick="document.getElementById('imageInput').click()" class="bg-white text-blue-600 px-3 py-1.5 rounded-lg text-[10px] font-black border uppercase">Tải ảnh</button>
                        <input type="file" id="imageInput" class="hidden" accept="image/*">
                    </div>
                </div>

                <div id="ingredientsSection" class="hidden mb-6">
                    <div class="bg-gray-50 border rounded-xl p-4">
                        <label class="block text-[10px] font-black text-gray-400 mb-2 uppercase">Các nguyên liệu hiện có:</label>
                        <input type="text" id="fridgeIngredients" class="w-full p-3 bg-white border rounded-lg outline-none text-sm font-bold" placeholder="VD: 200g thịt bò, 2 quả trứng...">
                    </div>
                </div>

                <div id="imagePreviewContainer" class="hidden mb-6 relative">
                    <img id="imagePreview" src="" class="w-full h-48 object-cover rounded-2xl shadow-md">
                    <button id="removeImage" class="absolute top-2 right-2 bg-red-500 text-white w-8 h-8 rounded-full"><i class="fas fa-times"></i></button>
                </div>

                <div class="grid grid-cols-2 gap-4 mb-6">
                    <div class="space-y-1.5">
                        <label class="text-[9px] font-black text-gray-400 uppercase ml-1 italic">Độ phức tạp thực đơn</label>
                        <select id="complexity" class="w-full p-3 bg-gray-50 border border-gray-100 rounded-xl text-xs font-bold text-gray-700 outline-none">
                            <option value="Dễ">🌟 Nấu nhanh 15p</option>
                            <option value="Trung bình" selected>🏠 Bữa cơm gia đình</option>
                            <option value="Khó">👨‍🍳 Chuẩn nhà hàng</option>
                        </select>
                    </div>
                    <div class="space-y-1.5">
                        <label class="text-[9px] font-black text-gray-400 uppercase ml-1 italic">Phong cách hướng dẫn</label>
                        <select id="persona" class="w-full p-3 bg-gray-50 border border-gray-100 rounded-xl text-xs font-bold text-gray-700 outline-none">
                            <option value="Chuyên sâu (MasterChef)">👨‍🔬 MasterChef</option>
                            <option value="Thân thiện (Gia đình)" selected>🌿 Gia đình</option>
                            <option value="Hài hước (Sáng tạo)">🤣 Vui nhộn</option>
                        </select>
                    </div>
                </div>

                <div class="mb-6">
                    <textarea id="userInput" rows="3" class="w-full p-4 bg-gray-50 border rounded-2xl outline-none focus:border-orange-400 text-sm" placeholder="Món bạn muốn ăn là gì? (Ví dụ: Thực đơn 3 món cho gia đình cuối tuần)"></textarea>
                </div>

                <button id="generateBtn" class="w-full bg-orange-600 text-white font-black py-4 rounded-2xl shadow-xl shadow-orange-500/20 flex items-center justify-center gap-2 btn-active-scale uppercase tracking-widest italic">
                    <i class="fas fa-wand-magic-sparkles"></i> NẤU NGAY !!!
                </button>

                <div id="loadingState" class="hidden text-center py-10">
                    <div class="w-12 h-12 border-4 border-orange-500/20 border-t-orange-500 rounded-full animate-spin mx-auto"></div>
                    <p class="mt-4 text-[10px] text-gray-400 font-black uppercase italic">Đang phân tích yêu cầu của bạn...</p>
                </div>

                <div id="resultContainer" class="hidden mt-10 space-y-6">
                    <div id="imageDisplayArea" class="hidden">
                        <div id="imageLoading" class="hidden py-8 text-center bg-gray-50 rounded-2xl border-2 border-dashed">
                             <p class="text-[10px] font-black text-gray-400 uppercase italic">Đây là các gợi ý cho bạn hôm nay...</p>
                        </div>
                        <img id="dishImage" class="hidden w-full h-64 object-cover rounded-2xl shadow-lg border-4 border-white" src="">
                    </div>

                    <div class="bg-white p-4 md:p-10 rounded-[2.5rem] border border-orange-50 shadow-inner overflow-hidden">
                        <div id="aiMetaHeader" class="recipe-meta"></div>
                        <div id="aiResponse" class="text-sm"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-3xl shadow-sm p-6 border border-gray-100">
            <h2 class="text-xs font-black text-gray-800 mb-6 flex items-center gap-2 uppercase italic tracking-widest">
                <i class="fas fa-history text-orange-400"></i> Lịch sử công thức gần đây
            </h2>
            <div id="historyList" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <p class="col-span-full text-center text-gray-400 py-4 italic text-[10px] uppercase">Đang tải...</p>
            </div>
        </div>
    </div>

    <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 z-[100] bg-gray-900/90 text-white px-8 py-3 rounded-full text-[10px] font-black uppercase tracking-widest shadow-2xl transition-all duration-500 opacity-0 translate-y-10"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot, serverTimestamp, addDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        
        const firebaseConfig = JSON.parse('{"apiKey":"AIzaSyBe6c5S5184DmWzjqRvcMkEBwN_UJ1zLD8","authDomain":"ainauan-f11d0.firebaseapp.com","projectId":"ainauan-f11d0","storageBucket":"ainauan-f11d0.firebasestorage.app","messagingSenderId":"855598869176","appId":"1:855598869176:web:462b821ab92fb7eba1624d"}');
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const customAppId = 'cooking-master-app-v2';
        const historyCollectionName = 'history_records';

        let user = null;
        let base64Image = null;
        let lastMainDish = "";
        let userApiKey = "";
        let shoppingList = JSON.parse(localStorage.getItem('ai_chef_shopping_v2') || '[]');

        const showToast = (m) => {
            const t = document.getElementById('toast');
            if (t) {
                t.innerText = m;
                t.classList.remove('opacity-0', 'translate-y-10');
                setTimeout(() => t.classList.add('opacity-0', 'translate-y-10'), 3000);
            }
        };

        const initAuth = async () => {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                try { await signInWithCustomToken(auth, __initial_auth_token); } 
                catch (e) { await signInAnonymously(auth); }
            } else { await signInAnonymously(auth); }
        };

        onAuthStateChanged(auth, async (u) => {
            user = u;
            if (user) {
                const configRef = doc(db, 'artifacts', customAppId, 'public', 'data', 'settings', 'global_config');
                const snap = await getDoc(configRef);
                if (snap.exists()) {
                    userApiKey = snap.data().apiKey;
                    document.getElementById('apiKeyInput').value = userApiKey || "";
                }
                setupHistoryListener();
                updateShoppingUI();
            } else { initAuth(); }
        });

        const updateShoppingUI = () => {
            const container = document.getElementById('shoppingItemsContainer');
            document.getElementById('cartCount').innerText = shoppingList.length;

            if (shoppingList.length === 0) {
                container.innerHTML = '<div class="text-center py-20 text-gray-300"><i class="fas fa-cart-shopping text-5xl mb-4"></i><p class="italic text-sm">Chưa có dữ liệu.</p></div>';
                return;
            }

            container.innerHTML = shoppingList.map((entry, entryIdx) => `
                <div class="bg-white p-4 rounded-2xl border border-gray-100 shadow-sm item-animate">
                    <div class="flex justify-between items-center mb-2 pb-2 border-b border-gray-50">
                        <span class="font-black text-orange-800 text-[10px] uppercase italic truncate w-3/4">${entry.dish}</span>
                        <button onclick="window.removeEntry(${entryIdx})" class="text-gray-300 hover:text-red-500"><i class="fas fa-trash-alt text-xs"></i></button>
                    </div>
                    <ul class="space-y-1.5">
                        ${entry.ingredients.map((ing, ingIdx) => `
                            <li class="flex items-start gap-3">
                                <input type="checkbox" ${ing.checked ? 'checked' : ''} onchange="window.toggleCheck(${entryIdx}, ${ingIdx})" class="w-4 h-4 mt-0.5 rounded border-gray-300 text-orange-500">
                                <span class="text-xs ${ing.checked ? 'line-through text-gray-300' : 'text-gray-600'} font-medium">${ing.name}</span>
                            </li>
                        `).join('')}
                    </ul>
                </div>
            `).join('');
            localStorage.setItem('ai_chef_shopping_v2', JSON.stringify(shoppingList));
        };

        window.removeEntry = (idx) => { shoppingList.splice(idx, 1); updateShoppingUI(); };
        window.toggleCheck = (eIdx, iIdx) => { shoppingList[eIdx].ingredients[iIdx].checked = !shoppingList[eIdx].ingredients[iIdx].checked; updateShoppingUI(); };
        document.getElementById('clearShoppingList').onclick = () => { if (confirm('Xóa danh sách?')) { shoppingList = []; updateShoppingUI(); } };

        const autoCaptureIngredients = () => {
            const container = document.getElementById('aiResponse');
            const elements = container.children;
            let currentDishName = lastMainDish || "Món ăn chính";
            let addedCount = 0;

            for (let i = 0; i < elements.length; i++) {
                const el = elements[i];
                if (el.tagName === 'H1' || el.tagName === 'H2') {
                    currentDishName = el.innerText.trim().replace(/^#+\s*/, '');
                }
                if (el.tagName === 'TABLE' || el.classList.contains('table-wrapper')) {
                    const table = el.tagName === 'TABLE' ? el : el.querySelector('table');
                    if (!table) continue;
                    const rows = table.querySelectorAll('tbody tr');
                    const ingredients = Array.from(rows).map(row => {
                        const cells = row.querySelectorAll('td');
                        const name = cells[0]?.innerText?.trim() || "";
                        const amount = cells[1]?.innerText?.trim() || "";
                        return name ? { name: `${name}${amount ? ' - ' + amount : ''}`, checked: false } : null;
                    }).filter(ing => ing !== null);
                    if (ingredients.length > 0) {
                        const exists = shoppingList.some(s => s.dish === currentDishName && s.ingredients.length === ingredients.length);
                        if (!exists) {
                            shoppingList.unshift({ dish: currentDishName, ingredients, timestamp: Date.now() });
                            addedCount++;
                        }
                    }
                }
            }
            if (addedCount > 0) { updateShoppingUI(); showToast(`Đã lưu ${addedCount} món vào danh sách!`); }
        };

        const setupHistoryListener = () => {
            if (!user) return;
            const historyRef = collection(db, 'artifacts', customAppId, 'public', 'data', historyCollectionName);
            onSnapshot(historyRef, (snapshot) => {
                const items = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                items.sort((a, b) => (b.createdAt?.toMillis() || 0) - (a.createdAt?.toMillis() || 0));
                renderHistory(items);
            }, (err) => console.error(err));
        };

        const renderHistory = (items) => {
            const list = document.getElementById('historyList');
            if (items.length === 0) { list.innerHTML = '<p class="col-span-full text-center text-gray-400 py-4 italic text-[10px] uppercase">Lịch sử trống.</p>'; return; }
            list.innerHTML = items.map(item => {
                const encoded = btoa(encodeURIComponent(item.content));
                const date = item.createdAt ? new Date(item.createdAt.toMillis()).toLocaleDateString('vi-VN') : 'Mới';
                return `
                    <div class="p-4 bg-gray-50 rounded-2xl border cursor-pointer hover:border-orange-200 hover:bg-white transition-all group" 
                         onclick="window.loadContent('${encoded}', '${(item.dishName || 'Món ăn').replace(/'/g, "\\'")}')">
                        <div class="flex justify-between items-center">
                            <h4 class="font-black text-gray-700 text-[10px] uppercase truncate flex-1 italic">${item.dishName || 'Món ăn'}</h4>
                            <i class="fas fa-arrow-right text-[10px] text-gray-300 group-hover:text-orange-500 ml-2 transition-colors"></i>
                        </div>
                        <div class="flex gap-2 mt-2">
                            <span class="text-[8px] text-gray-400 font-bold uppercase">${date}</span>
                            <span class="text-[8px] text-orange-400 font-black uppercase">• ${item.complexity || 'Vừa sức'}</span>
                        </div>
                    </div>`;
            }).join('');
        };

        window.loadContent = (encoded, title) => {
            const raw = decodeURIComponent(atob(encoded));
            document.getElementById('aiResponse').innerHTML = marked.parse(raw);
            lastMainDish = title;
            processTables();
            autoCaptureIngredients();
            document.getElementById('resultContainer').classList.remove('hidden');
            window.scrollTo({top: document.getElementById('resultContainer').offsetTop - 20, behavior: 'smooth'});
        };

        const processTables = () => {
            document.querySelectorAll('#aiResponse table').forEach(table => {
                const headers = Array.from(table.querySelectorAll('th')).map(th => th.innerText);
                table.querySelectorAll('tbody tr').forEach(row => {
                    row.querySelectorAll('td').forEach((cell, i) => { if (headers[i]) cell.setAttribute('data-label', headers[i]); });
                });
                if (!table.parentElement.classList.contains('table-wrapper')) {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'table-wrapper';
                    table.parentNode.insertBefore(wrapper, table);
                    wrapper.appendChild(table);
                }
            });
        };

        document.getElementById('generateBtn').onclick = async () => {
            if (!userApiKey) return showToast("Vui lòng cấu hình API Key.");
            const input = document.getElementById('userInput').value;
            const complexity = document.getElementById('complexity').value;
            const persona = document.getElementById('persona').value;

            document.getElementById('loadingState').classList.remove('hidden');
            document.getElementById('resultContainer').classList.add('hidden');

            const sysPrompt = `Bạn là Chef với phong cách hướng dẫn "${persona}". 
            Thiết kế thực đơn hoặc món ăn với độ khó: ${complexity}.
            
            QUY TẮC ĐỊNH DẠNG:
            1. Mỗi món ăn BẮT ĐẦU bằng tiêu đề # Tên món hoặc ## Tên món.
            2. Mỗi món PHẢI CÓ bảng nguyên liệu Markdown: | Nguyên liệu | Định lượng | Ghi chú |.
            3. Hướng dẫn các bước chi tiết phù hợp với trình độ "${complexity}".
            - Nếu là "Dễ": Ưu tiên nguyên liệu phổ biến tại siêu thị/chợ, tối giản các bước sơ chế, tổng thời gian nấu dưới 20 phút, có thể là các món ăn liền.
            - Nếu là "Trung bình": Tập trung vào các món cơm gia đình truyền thống hoặc hiện đại, có sự kết hợp nhiều món (mặn, canh, xào), quy trình chế biến đầy đủ các bước.
            - Nếu là "Khó": Sử dụng kỹ thuật nấu nướng nâng cao (như sous-vide, áp chảo chuẩn độ chín, làm sốt phức tạp), chú trọng vào decor (trình bày) và sự tầng lớp của hương vị.
            4. DỰA TRÊN PHONG CÁCH "${persona}", HÃY TUÂN THỦ CÁCH VIẾT:
            - Chuyên sâu (MasterChef): Sử dụng thuật ngữ chuyên môn, giải thích cơ chế hóa học của thực phẩm (ví dụ: phản ứng Maillard), tập trung vào sự chính xác tuyệt đối và tính nghệ thuật cao.
            - Thân thiện (Gia đình): Ngôn ngữ ấm áp, gần gũi như một người thân đang hướng dẫn. Ưu tiên các nguyên liệu dễ tìm, cách làm tối ưu hóa cho bếp gia đình và nhấn mạnh vào sự gắn kết.
            - Hài hước (Sáng tạo): Sử dụng ngôn từ vui nhộn, các ví dụ so sánh hóm hỉnh, tạo không khí thoải mái, cổ vũ người nấu thử nghiệm những điều mới lạ và phá cách.
            
            QUY TẮC NÂNG CAO KỸ NĂNG (QUAN TRỌNG):
            - Ngay cả khi phong cách là Thân thiện hay, hãy luôn lồng ghép các kỹ thuật nấu ăn chuyên sâu.
            - Cuối mỗi món ăn hoặc cuối toàn bộ hướng dẫn, PHẢI CÓ một phần tiêu đề "## 👨‍🍳 Chef's Secret Tips & Tricks" tổng hợp các mẹo nhỏ nhưng hiệu quả cao (Ví dụ: cách chọn thịt tươi, mẹo khử mùi, cách canh lửa, mẹo trình bày...). 
            - Những mẹo này phải thực sự hữu ích để nâng tầm món ăn từ mức gia đình lên chuyên nghiệp.`;

            try {
                let prompt = input || "Gợi ý thực đơn đặc sắc.";
                if (document.getElementById('fridgeToggle').checked) prompt = `Nguyên liệu có sẵn: ${document.getElementById('fridgeIngredients').value}. ${prompt}`;
                
                const contents = [{ role: "user", parts: [{ text: prompt }] }];
                if (base64Image) contents[0].parts.push({ inlineData: { mimeType: "image/png", data: base64Image } });

                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${userApiKey}`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ contents, systemInstruction: { parts: [{ text: sysPrompt }] } })
                });
                const data = await res.json();
                const text = data.candidates?.[0]?.content?.parts?.[0]?.text || "";
                
                const match = text.match(/^#+\s+(.+)$/m);
                lastMainDish = match ? match[1].trim() : "Thực đơn Master";

                document.getElementById('aiResponse').innerHTML = marked.parse(text);
                processTables();
                autoCaptureIngredients();
                
                document.getElementById('resultContainer').classList.remove('hidden');
                if (user) await addDoc(collection(db, 'artifacts', customAppId, 'public', 'data', historyCollectionName), {
                    dishName: lastMainDish, content: text, complexity, persona, createdAt: serverTimestamp()
                });

                // Generate main image
                document.getElementById('imageDisplayArea').classList.remove('hidden');
                document.getElementById('imageLoading').classList.remove('hidden');
                document.getElementById('dishImage').classList.add('hidden');
                const imgRes = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${userApiKey}`, {
                    method: 'POST', body: JSON.stringify({ instances: [{ prompt: `Gourmet food photo of ${lastMainDish}, professional studio lighting, depth of field` }], parameters: { sampleCount: 1 } })
                });
                const imgData = await imgRes.json();
                if (imgData.predictions?.[0]?.bytesBase64Encoded) {
                    document.getElementById('dishImage').src = `data:image/png;base64,${imgData.predictions[0].bytesBase64Encoded}`;
                    document.getElementById('dishImage').classList.remove('hidden');
                    document.getElementById('imageLoading').classList.add('hidden');
                }
            } catch (e) { showToast("Lỗi phân tích từ AI."); } finally { document.getElementById('loadingState').classList.add('hidden'); }
        };

        document.getElementById('saveSettings').onclick = async () => {
            const key = document.getElementById('apiKeyInput').value.trim();
            if (user && key) {
                await setDoc(doc(db, 'artifacts', customAppId, 'public', 'data', 'settings', 'global_config'), { apiKey: key, updatedAt: serverTimestamp() });
                userApiKey = key;
                showToast("Đã lưu API Key.");
                document.getElementById('settingsModal').classList.add('hidden');
            }
        };
        document.getElementById('openSettings').onclick = () => document.getElementById('settingsModal').classList.remove('hidden');
        document.getElementById('closeSettings').onclick = () => document.getElementById('settingsModal').classList.add('hidden');
        document.getElementById('fridgeToggle').onchange = (e) => document.getElementById('ingredientsSection').classList.toggle('hidden', !e.target.checked);
        document.getElementById('imageInput').onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    base64Image = ev.target.result.split(',')[1];
                    document.getElementById('imagePreview').src = ev.target.result;
                    document.getElementById('imagePreviewContainer').classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        };
        document.getElementById('removeImage').onclick = () => { base64Image = null; document.getElementById('imagePreviewContainer').classList.add('hidden'); };
        document.getElementById('toggleShoppingList').onclick = () => document.getElementById('shoppingListDrawer').classList.remove('translate-x-full');
        document.getElementById('closeShoppingList').onclick = () => document.getElementById('shoppingListDrawer').classList.add('translate-x-full');
    </script>
</body>
</html>
