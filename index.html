<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Chef Master - Sổ Tay Nấu Nướng Chuyên Nghiệp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap');
        
        :root {
            --primary-orange: #f97316;
            --secondary-amber: #fbbf24;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background: #fdf6f0;
            -webkit-tap-highlight-color: transparent;
        }

        .gradient-text {
            background: linear-gradient(90deg, var(--primary-orange), var(--secondary-amber));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Markdown Styling - Optimized for Mobile Tables */
        #aiResponse {
            font-family: 'Inter', sans-serif;
            color: #374151;
            line-height: 1.8;
        }
        
        #aiResponse h1, #aiResponse h2 {
            font-size: 1.5rem;
            font-weight: 800;
            color: #7c2d12;
            margin: 1.5rem 0 1rem 0;
            border-left: 4px solid var(--primary-orange);
            padding-left: 12px;
        }

        #aiResponse p { margin-bottom: 1rem; }

        /* Mobile-First Table System */
        #aiResponse table {
            width: 100%;
            display: block;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            border-collapse: separate;
            border-spacing: 0;
            margin: 1.5rem 0;
            border-radius: 16px;
            border: 1px solid #fed7aa;
            background: white;
        }

        #aiResponse th {
            background: #fff7ed;
            padding: 12px 16px;
            text-align: left;
            color: #9a3412;
            font-size: 0.85rem;
            font-weight: 700;
            border-bottom: 2px solid #fed7aa;
            white-space: nowrap;
        }

        #aiResponse td {
            padding: 12px 16px;
            border-bottom: 1px solid #fff7ed;
            font-size: 0.875rem;
        }

        #aiResponse tr:last-child td {
            border-bottom: none;
        }

        /* Responsive Improvements */
        @media (max-width: 640px) {
            #aiResponse table {
                border-radius: 12px;
            }
            #aiResponse th, #aiResponse td {
                padding: 10px 12px;
            }
        }

        .switch { position: relative; display: inline-block; width: 44px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #cbd5e1; transition: .4s; border-radius: 34px;
        }
        .slider:before {
            position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px;
            background-color: white; transition: .4s; border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--primary-orange); }
        input:checked + .slider:before { transform: translateX(22px); }

        .btn-active-scale:active { transform: scale(0.96); }
        .modal-overlay { background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); }
    </style>
</head>
<body class="min-h-screen pb-10">

    <div class="max-w-4xl mx-auto px-4 py-6">
        <header class="flex justify-between items-center mb-8">
            <div class="w-10"></div>
            <div class="text-center">
                <h1 class="text-3xl md:text-5xl font-extrabold gradient-text mb-1">AI Chef Master</h1>
                <p class="text-[10px] md:text-xs text-gray-400 font-bold uppercase tracking-widest italic">Nâng tầm ẩm thực gia đình</p>
            </div>
            <button id="openSettings" class="w-10 h-10 bg-white shadow-sm rounded-full flex items-center justify-center text-gray-400 hover:text-orange-500 border border-gray-100">
                <i class="fas fa-cog"></i>
            </button>
        </header>

        <!-- API Settings Modal -->
        <div id="settingsModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay">
            <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl overflow-hidden">
                <div class="p-5 border-b border-gray-50 flex justify-between items-center">
                    <h3 class="font-bold text-gray-800 italic">Cấu hình hệ thống</h3>
                    <button id="closeSettings" class="text-gray-400"><i class="fas fa-times"></i></button>
                </div>
                <div class="p-6 space-y-4">
                    <div>
                        <label class="block text-[10px] font-black text-gray-400 uppercase mb-2">Google Gemini API Key</label>
                        <input type="password" id="apiKeyInput" class="w-full p-4 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:border-orange-500 text-sm" placeholder="Dán API key vào đây...">
                    </div>
                    <button id="saveSettings" class="w-full bg-orange-500 text-white font-bold py-4 rounded-xl shadow-lg btn-active-scale">LƯU THÔNG TIN</button>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-[2rem] shadow-xl overflow-hidden border border-orange-50 mb-8">
            <div class="p-6 md:p-10">
                
                <!-- Main Controls -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                    <div class="flex items-center justify-between p-4 bg-orange-50/40 rounded-2xl border border-orange-100">
                        <div class="flex items-center gap-3">
                            <i class="fas fa-utensils text-orange-500"></i>
                            <span class="font-bold text-orange-900 text-sm">Chế độ "Dọn tủ"</span>
                        </div>
                        <label class="switch">
                            <input type="checkbox" id="fridgeToggle">
                            <span class="slider"></span>
                        </label>
                    </div>

                    <div class="flex items-center justify-between p-4 bg-blue-50/40 rounded-2xl border border-blue-100">
                        <div class="flex items-center gap-3">
                            <i class="fas fa-camera text-blue-500"></i>
                            <span class="font-bold text-blue-900 text-sm">Quét ảnh</span>
                        </div>
                        <button onclick="document.getElementById('imageInput').click()" class="bg-white text-blue-600 px-3 py-1.5 rounded-lg text-[10px] font-black border border-blue-100 uppercase">Chọn ảnh</button>
                        <input type="file" id="imageInput" class="hidden" accept="image/*">
                    </div>
                </div>

                <!-- Input Zone -->
                <div id="ingredientsSection" class="hidden mb-6">
                    <div class="bg-gray-50 border border-gray-200 rounded-xl p-4">
                        <label class="block text-[10px] font-black text-gray-400 mb-2 uppercase">Nguyên liệu đang có:</label>
                        <input type="text" id="fridgeIngredients" class="w-full p-3 bg-white border border-gray-200 rounded-lg outline-none text-sm font-bold" placeholder="VD: Trứng, cà chua, hành lá...">
                    </div>
                </div>

                <div id="imagePreviewContainer" class="hidden mb-6 relative">
                    <img id="imagePreview" src="" class="w-full h-48 object-cover rounded-2xl shadow-md">
                    <button id="removeImage" class="absolute top-2 right-2 bg-red-500 text-white w-8 h-8 rounded-full shadow-lg"><i class="fas fa-times"></i></button>
                </div>

                <div class="grid grid-cols-2 gap-4 mb-6">
                    <div class="space-y-1">
                        <label class="text-[10px] font-black text-gray-400 uppercase ml-1">Độ khó</label>
                        <select id="complexity" class="w-full p-3 bg-gray-50 border border-gray-100 rounded-xl text-xs font-bold text-gray-700 outline-none">
                            <option value="Dễ">🌟 Dễ (Dưới 15p)</option>
                            <option value="Trung bình" selected>🏠 Vừa (Bữa cơm gia đình)</option>
                            <option value="Khó">👨‍🍳 Khó (Yêu cầu kỹ thuật)</option>
                        </select>
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px] font-black text-gray-400 uppercase ml-1">Phong cách Chef</label>
                        <select id="persona" class="w-full p-3 bg-gray-50 border border-gray-100 rounded-xl text-xs font-bold text-gray-700 outline-none">
                            <option value="masterchef" selected>👨‍🍳 MasterChef</option>
                            <option value="friendly">🌿 Thân thiện</option>
                            <option value="funny">🤣 Hài hước</option>
                        </select>
                    </div>
                </div>

                <div class="mb-6">
                    <label class="text-[10px] font-black text-gray-400 uppercase ml-1 block mb-1">Món bạn muốn nấu hoặc yêu cầu riêng</label>
                    <textarea id="userInput" rows="3" class="w-full p-4 bg-gray-50 border border-gray-100 rounded-2xl outline-none focus:border-orange-400 text-sm" placeholder="Hôm nay tôi muốn ăn món gì đó thanh đạm..."></textarea>
                </div>

                <button id="generateBtn" class="w-full bg-orange-500 text-white font-black py-4 rounded-2xl shadow-xl shadow-orange-500/20 flex items-center justify-center gap-2 transition-all btn-active-scale">
                    <i class="fas fa-fire"></i> LÊN THỰC ĐƠN NGAY
                </button>

                <!-- Loading -->
                <div id="loadingState" class="hidden text-center py-10">
                    <div class="w-12 h-12 border-4 border-orange-500/20 border-t-orange-500 rounded-full animate-spin mx-auto"></div>
                    <p class="mt-4 text-[10px] text-gray-400 font-black uppercase tracking-widest">Đang thiết kế công thức...</p>
                </div>

                <!-- Result -->
                <div id="resultContainer" class="hidden mt-10 space-y-6">
                    <div class="border-t border-gray-50 pt-6">
                        <button id="generateImgBtn" class="w-full bg-amber-50 text-amber-700 font-bold py-3 rounded-xl flex items-center justify-center gap-2 border border-amber-100 text-xs">
                            <i class="fas fa-magic"></i> XUẤT ẢNH AI MINH HỌA
                        </button>
                    </div>
                    
                    <div id="imageDisplayArea" class="hidden">
                        <div id="imageLoading" class="hidden py-8 text-center bg-gray-50 rounded-2xl border-2 border-dashed border-gray-200">
                             <p class="text-[10px] font-black text-gray-400 uppercase">Đang vẽ hình ảnh món ăn...</p>
                        </div>
                        <img id="dishImage" class="hidden w-full h-64 object-cover rounded-2xl shadow-lg border-4 border-white" src="">
                    </div>

                    <div class="bg-white p-4 md:p-8 rounded-3xl border border-orange-50 shadow-inner">
                        <div id="aiResponse" class="text-sm"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- History -->
        <div class="bg-white rounded-3xl shadow-sm p-6 border border-gray-100">
            <h2 class="text-sm font-black text-gray-800 mb-4 flex items-center gap-2 uppercase tracking-tighter">
                <i class="fas fa-book-open text-orange-400"></i> Nhật ký nấu nướng
            </h2>
            <div id="historyList" class="grid grid-cols-1 md:grid-cols-2 gap-3">
                <p class="col-span-full text-center text-gray-400 py-4 italic text-xs">Đang tải nhật ký...</p>
            </div>
        </div>
    </div>

    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-[100] bg-gray-900 text-white px-6 py-3 rounded-full text-[10px] font-bold shadow-2xl transition-all duration-500 opacity-0 translate-y-10"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot, serverTimestamp, addDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = JSON.parse('{"apiKey":"AIzaSyBe6c5S5184DmWzjqRvcMkEBwN_UJ1zLD8","authDomain":"ainauan-f11d0.firebaseapp.com","projectId":"ainauan-f11d0","storageBucket":"ainauan-f11d0.firebasestorage.app","messagingSenderId":"855598869176","appId":"1:855598869176:web:462b821ab92fb7eba1624d"}');
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'pro-chef-master-final';

        let user = null;
        let base64Image = null;
        let lastDishName = "";
        let userApiKey = "";

        // UI Logic
        const showToast = (m) => {
            const t = document.getElementById('toast');
            if (t) {
                t.innerText = m;
                t.classList.remove('opacity-0', 'translate-y-10');
                setTimeout(() => t.classList.add('opacity-0', 'translate-y-10'), 2500);
            }
        };

        // Authentication Setup with fix for token mismatch
        const initAuth = async () => {
            try {
                // RULE 3: Auth BEFORE Queries. Check for __initial_auth_token first.
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    try {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } catch (tokenErr) {
                        console.warn("Custom token failed, falling back to anonymous", tokenErr);
                        await signInAnonymously(auth);
                    }
                } else {
                    await signInAnonymously(auth);
                }
            } catch (error) {
                console.error("Critical Auth error:", error);
            }
        };

        onAuthStateChanged(auth, async (u) => {
            user = u;
            if (user) {
                console.log("Authenticated as:", user.uid);
                // Load Settings
                try {
                    const configRef = doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'global');
                    const snap = await getDoc(configRef);
                    if (snap.exists()) {
                        userApiKey = snap.data().apiKey;
                        document.getElementById('apiKeyInput').value = userApiKey;
                    }
                } catch (e) {
                    console.error("Error loading settings:", e);
                }
                // Load History AFTER Auth
                loadHistory();
            } else {
                initAuth();
            }
        });

        const loadHistory = () => {
            if (!user) return;
            const historyList = document.getElementById('historyList');
            const ref = collection(db, 'artifacts', appId, 'public', 'data', 'history');
            
            // Listen for history updates with success/error callbacks
            onSnapshot(ref, (snap) => {
                const items = snap.docs.map(d => ({id: d.id, ...d.data()}));
                
                // RULE 2: Filter/Sort in memory
                items.sort((a, b) => {
                    const timeA = a.createdAt?.seconds || 0;
                    const timeB = b.createdAt?.seconds || 0;
                    return timeB - timeA;
                });

                if (items.length === 0) {
                    historyList.innerHTML = '<p class="col-span-full text-center text-gray-400 py-4 italic text-xs">Chưa có công thức nào được lưu.</p>';
                    return;
                }

                historyList.innerHTML = items.map(item => {
                    const encodedContent = btoa(encodeURIComponent(item.content));
                    const safeTitle = (item.title || "Không tên").replace(/'/g, "\\'");
                    const dateStr = item.createdAt ? new Date(item.createdAt.seconds * 1000).toLocaleDateString() : 'Vừa xong';
                    return `
                        <div class="p-4 bg-gray-50 rounded-xl border border-gray-100 cursor-pointer hover:border-orange-200 transition-all" onclick="window.loadContent('${encodedContent}', '${safeTitle}')">
                            <h4 class="font-bold text-gray-700 text-xs truncate">${item.title || "Công thức không tên"}</h4>
                            <p class="text-[8px] text-gray-400 mt-1 font-bold">${dateStr}</p>
                        </div>
                    `;
                }).join('');
            }, (error) => {
                console.error("History fetch error:", error);
                historyList.innerHTML = '<p class="col-span-full text-center text-red-400 py-4 text-xs">Lỗi phân quyền hoặc dữ liệu.</p>';
            });
        };

        window.loadContent = (encoded, title) => {
            try {
                const raw = decodeURIComponent(atob(encoded));
                document.getElementById('aiResponse').innerHTML = marked.parse(raw);
                lastDishName = title;
                document.getElementById('imageDisplayArea').classList.add('hidden');
                document.getElementById('resultContainer').classList.remove('hidden');
                window.scrollTo({top: document.getElementById('resultContainer').offsetTop - 20, behavior: 'smooth'});
            } catch (e) {
                showToast("Lỗi khi tải nội dung");
            }
        };

        document.getElementById('saveSettings').onclick = async () => {
            if (!user) return showToast("Đang kết nối...");
            const key = document.getElementById('apiKeyInput').value.trim();
            if (!key) return showToast("Vui lòng nhập Key");
            try {
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'global'), { apiKey: key });
                userApiKey = key;
                showToast("Đã lưu API Key");
                document.getElementById('settingsModal').classList.add('hidden');
            } catch (e) {
                showToast("Lỗi lưu cấu hình");
            }
        };

        document.getElementById('openSettings').onclick = () => document.getElementById('settingsModal').classList.remove('hidden');
        document.getElementById('closeSettings').onclick = () => document.getElementById('settingsModal').classList.add('hidden');
        document.getElementById('fridgeToggle').onchange = (e) => document.getElementById('ingredientsSection').classList.toggle('hidden', !e.target.checked);

        // Core Generation Logic with Exponential Backoff
        async function fetchGemini(url, payload) {
            let delay = 1000;
            for (let i = 0; i < 5; i++) {
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    if (response.ok) return await response.json();
                    if (response.status === 403) throw new Error("API Key không hợp lệ hoặc không có quyền.");
                } catch (err) {
                    if (i === 4) throw err;
                    await new Promise(r => setTimeout(r, delay));
                    delay *= 2;
                }
            }
        }

        document.getElementById('generateBtn').onclick = async () => {
            if (!userApiKey) return showToast("Cần nhập API Key trong cài đặt");
            if (!user) return showToast("Đang xác thực hệ thống...");
            
            const userInput = document.getElementById('userInput').value;
            const ingredients = document.getElementById('fridgeIngredients').value;
            const complexity = document.getElementById('complexity').value;
            const persona = document.getElementById('persona').value;

            document.getElementById('loadingState').classList.remove('hidden');
            document.getElementById('resultContainer').classList.add('hidden');

            let personaPrompt = "";
            switch(persona) {
                case 'masterchef': 
                    personaPrompt = "Bạn là MasterChef. Hãy giải thích cực kỳ chi tiết về NGUYÊN LÝ NẤU ĂN và cách kết hợp hương vị. Viết hướng dẫn dài và tỉ mỉ nhất có thể."; 
                    break;
                case 'friendly': 
                    personaPrompt = "Bạn là một người bạn nội trợ. Hãy dùng ngôn ngữ ấm áp, hướng dẫn NGẮN GỌN, DỄ HIỂU."; 
                    break;
                case 'funny': 
                    personaPrompt = "Bạn là đầu bếp hài hước. Hãy hướng dẫn bằng cách kể chuyện vui nhộn nhưng vẫn đảm bảo công thức chuẩn."; 
                    break;
            }

            const systemInstruction = `${personaPrompt} Độ khó: ${complexity}. Hãy viết công thức theo cấu trúc: # Tên món, ## Tổng quan, ## Nguyên liệu (dùng bảng Table), ## Chế biến tỉ mỉ, ## Mẹo từ Chef.`;

            try {
                let prompt = userInput || "Gợi ý một món ăn ngon hôm nay.";
                if (document.getElementById('fridgeToggle').checked) prompt = `Tủ lạnh có: ${ingredients}. Yêu cầu: ${prompt}`;

                const contents = [{ role: "user", parts: [{ text: prompt }] }];
                if (base64Image) contents[0].parts.push({ inlineData: { mimeType: "image/png", data: base64Image } });

                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${userApiKey}`;
                const data = await fetchGemini(url, { 
                    contents, 
                    systemInstruction: { parts: [{ text: systemInstruction }] },
                    generationConfig: { maxOutputTokens: 2048 }
                });

                const text = data.candidates?.[0]?.content?.parts?.[0]?.text || "Không có phản hồi từ AI.";
                lastDishName = text.split('\n')[0].replace('#', '').trim();

                document.getElementById('aiResponse').innerHTML = marked.parse(text);
                document.getElementById('resultContainer').classList.remove('hidden');

                // Save to history
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'history'), {
                    title: lastDishName,
                    content: text,
                    createdAt: serverTimestamp()
                });
                
                window.scrollTo({top: document.getElementById('resultContainer').offsetTop - 20, behavior: 'smooth'});
            } catch (e) {
                console.error(e);
                showToast("Lỗi: " + e.message);
            } finally {
                document.getElementById('loadingState').classList.add('hidden');
            }
        };

        document.getElementById('generateImgBtn').onclick = async () => {
            if (!lastDishName || !userApiKey) return;
            document.getElementById('imageDisplayArea').classList.remove('hidden');
            document.getElementById('imageLoading').classList.remove('hidden');
            document.getElementById('dishImage').classList.add('hidden');

            try {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${userApiKey}`;
                const data = await fetchGemini(url, {
                    instances: [{ prompt: `High-end food photography of ${lastDishName}, appetizing, gourmet plating, soft natural lighting` }],
                    parameters: { sampleCount: 1 }
                });
                
                if (data.predictions?.[0]?.bytesBase64Encoded) {
                    document.getElementById('dishImage').src = `data:image/png;base64,${data.predictions[0].bytesBase64Encoded}`;
                    document.getElementById('dishImage').classList.remove('hidden');
                    document.getElementById('imageLoading').classList.add('hidden');
                }
            } catch (e) {
                showToast("Lỗi tạo ảnh.");
                document.getElementById('imageDisplayArea').classList.add('hidden');
            }
        };

        document.getElementById('imageInput').onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    base64Image = ev.target.result.split(',')[1];
                    document.getElementById('imagePreview').src = ev.target.result;
                    document.getElementById('imagePreviewContainer').classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        };

        document.getElementById('removeImage').onclick = () => {
            base64Image = null;
            document.getElementById('imagePreviewContainer').classList.add('hidden');
        };
    </script>
</body>
</html>
